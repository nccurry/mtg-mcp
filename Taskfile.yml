version: '3'

vars:
  SOLUTION: mtg-mcp.slnx
  APP_PROJECT: src/MtgMcp.App/MtgMcp.App.csproj
  CONFIGURATION: Release
  RUNTIME: win-x64
  VERSION: 0.0.0-dev
  PACKAGE_ID: Nccurry.MtgMcp
  ARTIFACTS_DIR: artifacts
  PACKAGE_DIR: '{{.ARTIFACTS_DIR}}/packages'
  DIST_DIR: '{{.ARTIFACTS_DIR}}/dist'
  PUBLISH_DIR: '{{.ARTIFACTS_DIR}}/publish'
  COVERAGE_DIR: '{{.ARTIFACTS_DIR}}/coverage'
  LOCAL_INSTALL_PATH: ''
  LOCAL_VERSION: ''
  LOCAL_CLEANUP_DRY_RUN: 'false'

tasks:
  setup:
    desc: Restore tools and packages
    cmds:
      - dotnet tool restore
      - dotnet restore {{.SOLUTION}}

  tools:restore:
    desc: Restore local .NET tools
    cmds:
      - dotnet tool restore

  restore:
    desc: Restore NuGet packages
    cmds:
      - dotnet restore {{.SOLUTION}}

  build:
    desc: Build the solution
    deps: [restore]
    cmds:
      - dotnet build {{.SOLUTION}} --configuration {{.CONFIGURATION}} --no-restore

  test:
    desc: Run all non-live tests
    deps: [build]
    cmds:
      - dotnet test {{.SOLUTION}} --configuration {{.CONFIGURATION}} --no-build --filter "Category!=Live"

  test:unit:
    desc: Run unit tests
    cmds:
      - >
        dotnet test tests/MtgMcp.Core.Tests/MtgMcp.Core.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"

  test:integration:
    desc: Run fixture-based adapter tests
    cmds:
      - >
        dotnet test tests/MtgMcp.Scryfall.Tests/MtgMcp.Scryfall.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        dotnet test tests/MtgMcp.Archidekt.Tests/MtgMcp.Archidekt.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        dotnet test tests/MtgMcp.Moxfield.Tests/MtgMcp.Moxfield.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        dotnet test tests/MtgMcp.Playgroup.Tests/MtgMcp.Playgroup.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        dotnet test tests/MtgMcp.CommanderSpellbook.Tests/MtgMcp.CommanderSpellbook.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"

  test:e2e:
    desc: Run mocked MCP end-to-end tests
    deps: [build]
    cmds:
      - >
        dotnet test tests/MtgMcp.E2E.Tests/MtgMcp.E2E.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --no-build
        --filter "Category=E2E"

  test:live:
    desc: Run opt-in live tests against a throwaway Archidekt deck
    cmds:
      - dotnet test {{.SOLUTION}} --configuration {{.CONFIGURATION}} --filter "Category=Live"

  coverage:
    desc: Run coverage gates and generate the Codecov report
    cmds:
      - task: coverage:report
      - task: coverage:gates

  coverage:report:
    desc: Generate a source-only Cobertura report for Codecov
    deps: [tools:restore, build]
    cmds:
      - pwsh -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.COVERAGE_DIR}}' | Out-Null"
      - >
        dotnet tool run dotnet-coverage -- collect
        --settings CodeCoverage.runsettings
        --output {{.COVERAGE_DIR}}/codecov.cobertura.xml
        --output-format cobertura
        dotnet test {{.SOLUTION}}
        --configuration {{.CONFIGURATION}}
        --no-build
        --filter "Category!=Live"

  coverage:gates:
    desc: Enforce 85 percent line coverage gates using the Codecov report
    cmds:
      - pwsh -NoProfile -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 85

  coverage:core:
    desc: Enforce 85 percent line coverage for core deck services using the Codecov report
    deps: [coverage:report]
    cmds:
      - pwsh -NoProfile -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 85 -PackageName MtgMcp.Core

  coverage:scryfall:
    desc: Enforce 85 percent line coverage for the Scryfall client using the Codecov report
    deps: [coverage:report]
    cmds:
      - pwsh -NoProfile -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 85 -PackageName MtgMcp.Scryfall

  coverage:archidekt:
    desc: Enforce 85 percent line coverage for the Archidekt client using the Codecov report
    deps: [coverage:report]
    cmds:
      - pwsh -NoProfile -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 85 -PackageName MtgMcp.Archidekt

  format:
    desc: Format source
    cmds:
      - dotnet format {{.SOLUTION}}

  lint:
    desc: Build with analyzers
    cmds:
      - dotnet build {{.SOLUTION}} --configuration {{.CONFIGURATION}} -warnaserror

  ci:
    desc: Run the CI validation suite
    cmds:
      - task: lint
      - task: coverage:report
      - task: coverage:gates
      - task: smoke:mcp

  smoke:mcp:
    desc: Build the MCP host and verify service registration
    cmds:
      - dotnet run --project {{.APP_PROJECT}} -- --smoke

  install:
    desc: Install the current branch on this workstation
    cmds:
      - task: install:local

  install:local:
    desc: Pack, globally install, publish, and copy the current branch to the configured local MCP command path
    deps: [restore]
    cmds:
      - >
        pwsh -NoProfile -File scripts/install-local.ps1
        -Project "{{.APP_PROJECT}}"
        -Configuration "{{.CONFIGURATION}}"
        -PackageId "{{.PACKAGE_ID}}"
        -PackageDir "{{.PACKAGE_DIR}}"
        -PublishDir "{{.PUBLISH_DIR}}"
        -Runtime "{{.RUNTIME}}"
        -InstallPath "{{.LOCAL_INSTALL_PATH}}"
        -Version "{{.LOCAL_VERSION}}"

  install:local:cleanup:
    desc: Remove old unlocked versioned local MCP binaries while keeping the configured one
    cmds:
      - >
        pwsh -NoProfile -File scripts/cleanup-local-install.ps1
        -InstallPath "{{.LOCAL_INSTALL_PATH}}"
        {{if eq .LOCAL_CLEANUP_DRY_RUN "true"}}-DryRun{{end}}

  pack:
    desc: Pack the MCP host as a NuGet dotnet tool
    deps: [restore]
    cmds:
      - >
        dotnet pack {{.APP_PROJECT}}
        --configuration {{.CONFIGURATION}}
        --output {{.PACKAGE_DIR}}
        -p:Version={{.VERSION}}
        -p:PackageVersion={{.VERSION}}
        -p:ContinuousIntegrationBuild=true
        -p:IncludeSymbols=true
        -p:SymbolPackageFormat=snupkg

  publish:
    desc: Publish a single self-contained binary for the current runtime
    cmds:
      - task: publish:runtime

  publish:runtime:
    desc: Publish a single self-contained binary for RUNTIME
    cmds:
      - >
        dotnet publish {{.APP_PROJECT}}
        --configuration {{.CONFIGURATION}}
        --runtime {{.RUNTIME}}
        --self-contained true
        --output {{.PUBLISH_DIR}}/{{.RUNTIME}}
        -p:Version={{.VERSION}}
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false

  publish:all:
    desc: Publish common desktop runtimes
    cmds:
      - task: publish:runtime
        vars:
          RUNTIME: win-x64
      - task: publish:runtime
        vars:
          RUNTIME: linux-x64
      - task: publish:runtime
        vars:
          RUNTIME: osx-arm64

  release:clean:
    desc: Remove release artifacts
    cmds:
      - pwsh -NoProfile -File scripts/release.ps1 Clean -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PackageDir "{{.PACKAGE_DIR}}" -DistDir "{{.DIST_DIR}}" -PublishDir "{{.PUBLISH_DIR}}"

  release:validate-version:
    desc: Validate VERSION as a stable release tag
    cmds:
      - pwsh -NoProfile -File scripts/release.ps1 ValidateVersion -Version "{{.VERSION}}"

  release:archives:
    desc: Publish and archive all release runtimes
    cmds:
      - task: publish:runtime
        vars:
          RUNTIME: win-x64
      - pwsh -NoProfile -File scripts/release.ps1 Archive -Version "{{.VERSION}}" -Runtime win-x64 -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PublishDir "{{.PUBLISH_DIR}}" -DistDir "{{.DIST_DIR}}"
      - task: publish:runtime
        vars:
          RUNTIME: linux-x64
      - pwsh -NoProfile -File scripts/release.ps1 Archive -Version "{{.VERSION}}" -Runtime linux-x64 -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PublishDir "{{.PUBLISH_DIR}}" -DistDir "{{.DIST_DIR}}"
      - task: publish:runtime
        vars:
          RUNTIME: osx-arm64
      - pwsh -NoProfile -File scripts/release.ps1 Archive -Version "{{.VERSION}}" -Runtime osx-arm64 -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PublishDir "{{.PUBLISH_DIR}}" -DistDir "{{.DIST_DIR}}"

  release:checksums:
    desc: Generate SHA256 checksums for release archives
    cmds:
      - pwsh -NoProfile -File scripts/release.ps1 Checksums -DistDir "{{.DIST_DIR}}"

  release:winget:
    desc: Generate a local WinGet manifest artifact
    cmds:
      - pwsh -NoProfile -File scripts/release.ps1 WingetManifest -Version "{{.VERSION}}" -ArtifactsDir "{{.ARTIFACTS_DIR}}" -DistDir "{{.DIST_DIR}}"

  release:tool-smoke:
    desc: Install the local NuGet tool package and smoke-run it
    cmds:
      - pwsh -NoProfile -File scripts/release.ps1 ToolSmoke -Version "{{.VERSION}}" -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PackageDir "{{.PACKAGE_DIR}}" -PackageId "{{.PACKAGE_ID}}"

  release:verify:
    desc: Run CI, package, archive, checksum, and smoke-install checks
    cmds:
      - task: ci
      - task: release:clean
      - task: pack
      - task: release:archives
      - task: release:winget
      - task: release:checksums
      - task: release:tool-smoke

  deps:check:
    desc: List outdated NuGet packages
    cmds:
      - dotnet list {{.SOLUTION}} package --outdated

  deps:update:
    desc: Restore after editing Directory.Packages.props
    cmds:
      - dotnet restore {{.SOLUTION}}

  clean:
    desc: Remove build outputs
    cmds:
      - dotnet clean {{.SOLUTION}}
