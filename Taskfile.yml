version: '3'

dotenv:
  - versions.env

vars:
  SOLUTION: mtg-mcp.slnx
  APP_PROJECT: src/MtgMcp.App/MtgMcp.App.csproj
  CONFIGURATION: Release
  # The pinned .NET preview SDK intermittently fails solution restore/build with parallel MSBuild.
  MSBUILD_MAXCPUCOUNT: 1
  DOTNET: '{{if eq OS "windows"}}.dotnet/dotnet.exe{{else}}./.dotnet/dotnet{{end}}'
  POWERSHELL: '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass{{else}}{{.TASKFILE_DIR}}/.tools/bin/pwsh -NoProfile{{end}}'
  RUNTIME_ARCH: '{{if eq ARCH "amd64"}}x64{{else}}{{ARCH}}{{end}}'
  RUNTIME: '{{if eq OS "windows"}}win-{{.RUNTIME_ARCH}}{{else if eq OS "darwin"}}osx-{{.RUNTIME_ARCH}}{{else}}linux-{{.RUNTIME_ARCH}}{{end}}'
  VERSION: ''
  PACKAGE_ID: Nccurry.MtgMcp
  ARTIFACTS_DIR: artifacts
  PACKAGE_DIR: '{{.ARTIFACTS_DIR}}/packages'
  DIST_DIR: '{{.ARTIFACTS_DIR}}/dist'
  PUBLISH_DIR: '{{.ARTIFACTS_DIR}}/publish'
  COVERAGE_DIR: '{{.ARTIFACTS_DIR}}/coverage'
  LOCAL_INSTALL_PATH: ''
  LOCAL_VERSION: ''
  LOCAL_CLEANUP_DRY_RUN: 'false'

env:
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  PATH: '{{if eq OS "windows"}}{{.TASKFILE_DIR}}/.dotnet;{{.TASKFILE_DIR}}/.tools/bin;{{.PATH}}{{else}}{{.TASKFILE_DIR}}/.dotnet:{{.TASKFILE_DIR}}/.tools/bin:{{.PATH}}{{end}}'
  Path: '{{if eq OS "windows"}}{{.TASKFILE_DIR}}/.dotnet;{{.TASKFILE_DIR}}/.tools/bin;{{.PATH}}{{else}}{{.PATH}}{{end}}'

tasks:
  setup:
    desc: Install local development dependencies and restore the repo
    cmds:
      - task: setup:powershell
      - task: setup:dotnet
      - task: tools:restore
      - task: restore
      - task: setup:verify

  deps:sync:
    desc: Sync derived version references from the authored sources (global.json, versions.env)
    deps: [setup:powershell]
    cmds:
      - '{{.POWERSHELL}} -File scripts/sync-versions.ps1 {{.CLI_ARGS}}'

  setup:linux:
    desc: Install local Linux prerequisites and restore the repo
    cmds:
      - bash scripts/setup-linux.sh

  setup:windows:
    desc: Install local Windows development dependencies and restore the repo
    cmds:
      - task: setup

  setup:darwin:
    desc: Install local macOS development dependencies and restore the repo
    cmds:
      - task: setup

  setup:powershell:
    desc: Install the pinned PowerShell under .tools when missing
    cmds:
      - cmd: echo "Windows uses the built-in PowerShell; nothing to install."
        platforms: [windows]
      - cmd: |
          expected="{{.POWERSHELL_VERSION}}"
          tools_dir="{{.TASKFILE_DIR}}/.tools"
          tools_bin="$tools_dir/bin"
          mkdir -p "$tools_bin"

          if [ -x "$tools_bin/pwsh" ] \
            && [ "$("$tools_bin/pwsh" -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' 2>/dev/null)" = "$expected" ]; then
            echo "PowerShell $expected is already installed under $tools_dir."
            exit 0
          fi

          if command -v pwsh >/dev/null 2>&1 \
            && [ "$(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' 2>/dev/null)" = "$expected" ]; then
            ln -sfn "$(command -v pwsh)" "$tools_bin/pwsh"
            echo "Linked system PowerShell $expected into $tools_bin."
            exit 0
          fi

          case "$(uname -s)" in
            Linux) platform=linux ;;
            Darwin) platform=osx ;;
            *) echo "Unsupported operating system: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64 | amd64) arch=x64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "Unsupported processor architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="$tools_dir/powershell-$expected-$platform-$arch"
          if [ -x "$install_dir/pwsh" ] \
            && [ "$("$install_dir/pwsh" -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' 2>/dev/null)" = "$expected" ]; then
            ln -sfn "$install_dir/pwsh" "$tools_bin/pwsh"
            echo "PowerShell $expected is already present under $install_dir."
            exit 0
          fi

          archive="$tools_dir/powershell-$expected-$platform-$arch.tar.gz"
          url="https://github.com/PowerShell/PowerShell/releases/download/v$expected/powershell-$expected-$platform-$arch.tar.gz"

          echo "Installing PowerShell $expected into $install_dir."
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL "$url" -o "$archive"
          elif command -v wget >/dev/null 2>&1; then
            wget -q "$url" -O "$archive"
          else
            echo "curl or wget is required to install PowerShell." >&2
            exit 1
          fi

          tar -xzf "$archive" -C "$install_dir"
          chmod +x "$install_dir/pwsh"
          ln -sfn "$install_dir/pwsh" "$tools_bin/pwsh"
          echo "PowerShell $expected installed under $install_dir."
        platforms: [linux, darwin]

  setup:dotnet:
    desc: Install the .NET SDK pinned in global.json under .dotnet when missing
    cmds:
      - cmd: '{{.POWERSHELL}} -File scripts/install-dotnet.ps1 -JsonFile "global.json" -InstallDir ".dotnet"'
        platforms: [windows]
      - cmd: |
          install_dir=".dotnet"
          dotnet_path="$install_dir/dotnet"
          expected="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' global.json | head -n 1)"

          if [ -n "$expected" ] && [ -x "$dotnet_path" ]; then
            if "$dotnet_path" --list-sdks 2>/dev/null | grep -q "^$expected "; then
              echo ".NET SDK $expected is already installed under $install_dir."
              exit 0
            fi
          fi

          mkdir -p "$install_dir"
          installer="$(mktemp)"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$installer"
          elif command -v wget >/dev/null 2>&1; then
            wget -q https://dot.net/v1/dotnet-install.sh -O "$installer"
          else
            echo "curl or wget is required to install the .NET SDK." >&2
            exit 1
          fi

          chmod +x "$installer"
          "$installer" --jsonfile global.json --install-dir "$install_dir" --no-path
          rm -f "$installer"
          echo ".NET SDK from global.json installed under $install_dir."
        platforms: [linux, darwin]

  setup:verify:
    desc: Verify the bootstrapped development tools
    deps: [setup:dotnet]
    cmds:
      - '{{.DOTNET}} --version'
      - '{{.DOTNET}} tool list --local'

  tools:restore:
    desc: Restore local .NET tools
    deps: [setup:dotnet]
    cmds:
      - '{{.DOTNET}} tool restore'

  restore:
    desc: Restore NuGet packages
    deps: [setup:dotnet]
    cmds:
      - '{{.DOTNET}} restore {{.SOLUTION}} -m:{{.MSBUILD_MAXCPUCOUNT}}'

  build:
    desc: Build the solution
    deps: [restore]
    cmds:
      - '{{.DOTNET}} build {{.SOLUTION}} --configuration {{.CONFIGURATION}} --no-restore -m:{{.MSBUILD_MAXCPUCOUNT}}'

  test:
    desc: Run all non-live tests
    deps: [build]
    cmds:
      - '{{.DOTNET}} test {{.SOLUTION}} --configuration {{.CONFIGURATION}} --no-build --filter "Category!=Live"'

  test:unit:
    desc: Run application and Core unit tests
    deps: [restore]
    cmds:
      - >
        {{.DOTNET}} test tests/MtgMcp.App.Tests/MtgMcp.App.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        {{.DOTNET}} test tests/MtgMcp.Core.Tests/MtgMcp.Core.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        {{.DOTNET}} test tests/MtgMcp.Statistics.Tests/MtgMcp.Statistics.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"

  test:integration:
    desc: Run architecture and local deck integration tests
    deps: [restore]
    cmds:
      - >
        {{.DOTNET}} test tests/MtgMcp.Architecture.Tests/MtgMcp.Architecture.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        {{.DOTNET}} test tests/MtgMcp.Decks.Tests/MtgMcp.Decks.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        {{.DOTNET}} test tests/MtgMcp.Scryfall.Tests/MtgMcp.Scryfall.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        {{.DOTNET}} test tests/MtgMcp.Archidekt.Tests/MtgMcp.Archidekt.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"
      - >
        {{.DOTNET}} test tests/MtgMcp.Playgroup.Tests/MtgMcp.Playgroup.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --filter "Category!=Live"

  test:e2e:
    desc: Run foundation process end-to-end tests
    deps: [build]
    cmds:
      - >
        {{.DOTNET}} test tests/MtgMcp.E2E.Tests/MtgMcp.E2E.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --no-build
        --filter "Category=E2E"

  test:live:
    desc: Run bounded live-provider tests; full corpus and Archidekt mutations require explicit opt-in
    deps: [restore]
    cmds:
      - '{{.DOTNET}} test {{.SOLUTION}} --configuration {{.CONFIGURATION}} --filter "Category=Live"'

  test:live:methods:
    desc: Install the package and run explicitly enabled method-by-method live acceptance
    deps: [build, pack]
    cmds:
      - '{{.POWERSHELL}} -File scripts/release.ps1 LiveAcceptance -Version "{{.VERSION}}" -Project "{{.APP_PROJECT}}" -Configuration "{{.CONFIGURATION}}" -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PackageDir "{{.PACKAGE_DIR}}" -PackageId "{{.PACKAGE_ID}}"'

  coverage:
    desc: Run coverage gates and generate the Codecov report
    cmds:
      - task: coverage:report
      - task: coverage:gates

  coverage:report:
    desc: Generate a source-only Cobertura report for Codecov
    deps: [tools:restore, build]
    cmds:
      - '{{.POWERSHELL}} -Command "New-Item -ItemType Directory -Force -Path ''{{.COVERAGE_DIR}}'' | Out-Null"'
      - >
        {{.DOTNET}} tool run dotnet-coverage -- collect
        --settings CodeCoverage.runsettings
        --output {{.COVERAGE_DIR}}/codecov.cobertura.xml
        --output-format cobertura
        {{.DOTNET}} test {{.SOLUTION}}
        --configuration {{.CONFIGURATION}}
        --no-build
        --filter "Category!=Live"

  coverage:gates:
    desc: Enforce 90 percent line coverage for every production assembly
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90'

  coverage:core:
    desc: Enforce 90 percent line coverage for Core using the Codecov report
    deps: [coverage:report]
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90 -PackageName MtgMcp.Core'

  coverage:app:
    desc: Enforce 90 percent line coverage for the application using the Codecov report
    deps: [coverage:report]
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90 -PackageName MtgMcp.App'

  coverage:decks:
    desc: Enforce 90 percent line coverage for local deck persistence using the Codecov report
    deps: [coverage:report]
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90 -PackageName MtgMcp.Decks'

  coverage:scryfall:
    desc: Enforce 90 percent line coverage for the Scryfall adapter using the Codecov report
    deps: [coverage:report]
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90 -PackageName MtgMcp.Scryfall'

  coverage:archidekt:
    desc: Enforce 90 percent line coverage for the Archidekt adapter using the Codecov report
    deps: [coverage:report]
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90 -PackageName MtgMcp.Archidekt'

  coverage:playgroup:
    desc: Enforce 90 percent line coverage for the Playgroup adapter using the Codecov report
    deps: [coverage:report]
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90 -PackageName MtgMcp.Playgroup'

  coverage:statistics:
    desc: Enforce 90 percent line coverage for exact statistics using the Codecov report
    deps: [coverage:report]
    cmds:
      - '{{.POWERSHELL}} -File scripts/coverage.ps1 VerifyGates -ReportPath "{{.COVERAGE_DIR}}/codecov.cobertura.xml" -Threshold 90 -PackageName MtgMcp.Statistics'

  format:
    desc: Format source
    deps: [setup:dotnet]
    cmds:
      - '{{.DOTNET}} format {{.SOLUTION}}'

  format:check:
    desc: Verify source formatting without changing files
    deps: [setup:dotnet]
    cmds:
      - '{{.DOTNET}} format {{.SOLUTION}} --verify-no-changes'

  lint:
    desc: Verify formatting and build with strict analyzers
    deps: [format:check]
    cmds:
      - '{{.DOTNET}} build {{.SOLUTION}} --configuration {{.CONFIGURATION}} -warnaserror -m:{{.MSBUILD_MAXCPUCOUNT}}'

  validate:
    desc: Run lint and all non-live tests
    cmds:
      - task: lint
      - task: test

  surface:report:
    desc: Verify the exact implemented MCP surface
    deps: [build]
    cmds:
      - >
        {{.DOTNET}} test tests/MtgMcp.Architecture.Tests/MtgMcp.Architecture.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --no-build
        --filter "FullyQualifiedName~FoundationArchitectureTests.SourceSurface_ContainsOnlyApprovedCapabilityToolsAndResource"
        --logger "console;verbosity=detailed"

  ci:
    desc: Run the CI validation suite
    cmds:
      - task: lint
      - task: surface:report
      - task: coverage:report
      - task: coverage:gates
      - task: smoke:process
      - task: smoke:mcp

  smoke:process:
    desc: Build the executable and verify process readiness
    deps: [build]
    cmds:
      - '{{.DOTNET}} run --project {{.APP_PROJECT}} --configuration {{.CONFIGURATION}} --no-build -- --smoke'

  smoke:mcp:
    desc: Verify MCP initialization, resources, deck workflows, Scryfall evidence, and provider schemas
    deps: [build]
    cmds:
      - >
        {{.DOTNET}} test tests/MtgMcp.E2E.Tests/MtgMcp.E2E.Tests.csproj
        --configuration {{.CONFIGURATION}}
        --no-build
        --filter "FullyQualifiedName~FoundationMcpTests|FullyQualifiedName~DeckMcpTests|FullyQualifiedName~DeckInterchangeMcpTests|FullyQualifiedName~ToolsetNorthStarMcpTests|FullyQualifiedName~ScryfallMcpTests|FullyQualifiedName~StatisticsMcpTests"

  install:
    desc: Install the current branch on this workstation
    cmds:
      - task: install:local

  install:local:
    desc: Pack, globally install, publish, and copy the current branch to the configured local MCP command path
    deps: [setup:dotnet, setup:powershell, restore]
    env:
      DOTNET_ROOT: '{{.TASKFILE_DIR}}/.dotnet'
      DOTNET_ROOT_X64: '{{.TASKFILE_DIR}}/.dotnet'
    cmds:
      - >
        {{.POWERSHELL}} -File scripts/install-local.ps1
        -Project "{{.APP_PROJECT}}"
        -Configuration "{{.CONFIGURATION}}"
        -PackageId "{{.PACKAGE_ID}}"
        -PackageDir "{{.PACKAGE_DIR}}"
        -PublishDir "{{.PUBLISH_DIR}}"
        -Runtime "{{.RUNTIME}}"
        -InstallPath "{{.LOCAL_INSTALL_PATH}}"
        -Version "{{.LOCAL_VERSION}}"

  install:local:cleanup:
    desc: Remove old unlocked versioned local MCP binaries while keeping the configured one
    cmds:
      - >
        {{.POWERSHELL}} -File scripts/cleanup-local-install.ps1
        -InstallPath "{{.LOCAL_INSTALL_PATH}}"
        {{if eq .LOCAL_CLEANUP_DRY_RUN "true"}}-DryRun{{end}}

  pack:
    desc: Pack the application as a NuGet dotnet tool
    deps: [restore]
    cmds:
      - >
        {{.DOTNET}} pack {{.APP_PROJECT}}
        --configuration {{.CONFIGURATION}}
        --output {{.PACKAGE_DIR}}
        {{if ne .VERSION ""}}-p:Version={{.VERSION}}{{end}}
        -p:ContinuousIntegrationBuild=true
        -p:IncludeSymbols=true
        -p:SymbolPackageFormat=snupkg

  publish:
    desc: Publish a single self-contained binary for the current runtime
    cmds:
      - task: publish:runtime

  publish:runtime:
    desc: Publish a single self-contained binary for RUNTIME
    deps: [setup:dotnet]
    cmds:
      - >
        {{.DOTNET}} publish {{.APP_PROJECT}}
        --configuration {{.CONFIGURATION}}
        --runtime {{.RUNTIME}}
        --self-contained true
        --output {{.PUBLISH_DIR}}/{{.RUNTIME}}
        {{if ne .VERSION ""}}-p:Version={{.VERSION}}{{end}}
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false

  publish:all:
    desc: Publish common desktop runtimes
    cmds:
      - task: publish:runtime
        vars:
          RUNTIME: win-x64
      - task: publish:runtime
        vars:
          RUNTIME: linux-x64
      - task: publish:runtime
        vars:
          RUNTIME: osx-arm64

  release:clean:
    desc: Remove release artifacts
    cmds:
      - '{{.POWERSHELL}} -File scripts/release.ps1 Clean -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PackageDir "{{.PACKAGE_DIR}}" -DistDir "{{.DIST_DIR}}" -PublishDir "{{.PUBLISH_DIR}}"'

  release:validate-version:
    desc: Validate VERSION as a stable release tag
    cmds:
      - '{{.POWERSHELL}} -File scripts/release.ps1 ValidateVersion -Version "{{.VERSION}}" -Project "{{.APP_PROJECT}}"'

  release:archives:
    desc: Publish and archive all release runtimes
    cmds:
      - task: publish:runtime
        vars:
          RUNTIME: win-x64
      - '{{.POWERSHELL}} -File scripts/release.ps1 Archive -Version "{{.VERSION}}" -Project "{{.APP_PROJECT}}" -Runtime win-x64 -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PublishDir "{{.PUBLISH_DIR}}" -DistDir "{{.DIST_DIR}}"'
      - task: publish:runtime
        vars:
          RUNTIME: linux-x64
      - '{{.POWERSHELL}} -File scripts/release.ps1 Archive -Version "{{.VERSION}}" -Project "{{.APP_PROJECT}}" -Runtime linux-x64 -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PublishDir "{{.PUBLISH_DIR}}" -DistDir "{{.DIST_DIR}}"'
      - task: publish:runtime
        vars:
          RUNTIME: osx-arm64
      - '{{.POWERSHELL}} -File scripts/release.ps1 Archive -Version "{{.VERSION}}" -Project "{{.APP_PROJECT}}" -Runtime osx-arm64 -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PublishDir "{{.PUBLISH_DIR}}" -DistDir "{{.DIST_DIR}}"'

  release:checksums:
    desc: Generate SHA256 checksums for release archives
    cmds:
      - '{{.POWERSHELL}} -File scripts/release.ps1 Checksums -DistDir "{{.DIST_DIR}}"'

  release:tool-smoke:
    desc: Install the local NuGet tool, probe it, and verify a real MCP session
    deps: [build]
    cmds:
      - '{{.POWERSHELL}} -File scripts/release.ps1 ToolSmoke -Version "{{.VERSION}}" -Project "{{.APP_PROJECT}}" -Configuration "{{.CONFIGURATION}}" -ArtifactsDir "{{.ARTIFACTS_DIR}}" -PackageDir "{{.PACKAGE_DIR}}" -PackageId "{{.PACKAGE_ID}}"'

  release:verify:
    desc: Run CI, package, archive, checksum, and smoke-install checks
    cmds:
      - task: ci
      - task: release:clean
      - task: pack
      - task: release:archives
      - task: release:checksums
      - task: release:tool-smoke

  deps:check:
    desc: List outdated NuGet packages
    deps: [restore]
    cmds:
      - '{{.DOTNET}} list {{.SOLUTION}} package --outdated'

  deps:update:
    desc: Bump pinned tool and SDK versions to the latest and sync derived files
    deps: [setup:powershell]
    cmds:
      - '{{.POWERSHELL}} -File scripts/update-versions.ps1 {{.CLI_ARGS}}'
      - task: deps:sync

  clean:
    desc: Remove build outputs
    deps: [setup:dotnet]
    cmds:
      - '{{.DOTNET}} clean {{.SOLUTION}}'
