name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Linux native dependencies
        run: bash scripts/install-linux-native-deps.sh

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Build with analyzers
        run: task lint

      - name: Verify exact implemented MCP surface
        run: task surface:report

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Generate coverage report
        run: task coverage:report

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/codecov.cobertura.xml

      - name: Enforce coverage gates
        run: task coverage:gates

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage/codecov.cobertura.xml
          disable_search: true
          flags: all-src
          fail_ci_if_error: true

      - name: Probe process readiness
        run: task smoke:process

      - name: Exercise MCP deck, Scryfall, and Playgroup surfaces
        run: task smoke:mcp

      - name: Clean release artifacts
        run: task release:clean

      - name: Pack NuGet tool
        run: task pack VERSION=0.9.0-preview.0

      - name: Build release archives
        run: task release:archives VERSION=0.9.0-preview.0

      - name: Generate release checksums
        run: task release:checksums

      - name: Exercise installed tool package
        run: task release:tool-smoke VERSION=0.9.0-preview.0
