name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.1"

      - name: Install Linux native dependencies
        run: bash scripts/install-linux-native-deps.sh

      - name: Validate release tag
        run: |
          task release:validate-version VERSION="${GITHUB_REF_NAME}"
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Verify release artifacts
        run: task release:verify VERSION="${VERSION}"

      - name: Publish NuGet package
        shell: bash
        run: |
          for package in artifacts/packages/*.nupkg; do
            mise exec -- dotnet nuget push "${package}" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Wait for NuGet package availability
        shell: bash
        run: |
          package_url="https://api.nuget.org/v3-flatcontainer/nccurry.mtgmcp/${VERSION}/nccurry.mtgmcp.${VERSION}.nupkg"
          for attempt in {1..20}; do
            if curl --fail --silent --head "${package_url}" > /dev/null; then
              exit 0
            fi

            echo "NuGet package is not visible yet; waiting..."
            sleep 15
          done

          echo "::error::NuGet package did not become available: ${package_url}"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/dist/*
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: Update MCP Registry metadata version
        shell: bash
        run: |
          jq --arg version "${VERSION}" \
            '.version = $version | .packages[0].version = $version' \
            server.json > server.tmp
          mv server.tmp server.json

      - name: Validate MCP Registry metadata
        run: task registry:validate

      - name: Authenticate to MCP Registry
        run: task registry:login

      - name: Publish to MCP Registry
        run: task registry:publish
